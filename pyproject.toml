[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "cha2rttm"
version = "0.3.0"
description = "Speaker diarization with voice-type classification"
requires-python = ">=3.9"
dependencies = [
    "pyannote.audio>=3.1",
    "torch>=2.0",
    "torchaudio>=2.0",
    "pylangacq>=0.16",
    "pyyaml>=6.0",
]

[project.scripts]
speechlab-diarize = "speechlab_diarization.main:main"