models:
  pyannote_pipeline: "pyannote/speaker-diarization-3.1"

voice_type:
  backend: "vtc2"
  vtc2_root: "/opt/vtc15"
  vtc2_checkpoint: "model/best.ckpt"
  vtc2_config: "model/config.yml"
  vtc2_no_device: true
  vtc2_ckpt_arg: "--ckpt"
  vtc2_config_arg: "-c"

huggingface:
  token_env_var: "HF_TOKEN"

runtime:
  sample_rate: 16000
  device: "cuda"
  max_duration_minutes: 60

io:
  input_dir: "/data/input"
  output_dir: "/data/output"
